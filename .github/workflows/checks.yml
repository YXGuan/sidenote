name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --target research-partner/.local-tools/python -r research-partner/requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s research-partner/tests -v
      - run: python -B tools/render_taxonomy.py --check
      - run: python -B tools/check_public.py
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: ./hypothesis/build
      - run: node .yarn/releases/yarn-3.6.0.cjs typecheck
        working-directory: hypothesis/client
      - run: node .yarn/releases/yarn-3.6.1.cjs typecheck
        working-directory: hypothesis/browser-extension
      - run: node .yarn/releases/yarn-3.6.0.cjs exec playwright install --with-deps chromium
        working-directory: hypothesis/client
      - run: node .yarn/releases/yarn-3.6.0.cjs test --grep 'library|Library|PageResearch|ResearchWorkspace|ResearchWiki|KuraWorkspace|annotation-visibility|LocalResearchActions|AnnotationScopeControls'
        working-directory: hypothesis/client
      - run: node .yarn/releases/yarn-3.6.1.cjs exec playwright install --with-deps chromium
        working-directory: hypothesis/browser-extension
      - run: node .yarn/releases/yarn-3.6.1.cjs test
        working-directory: hypothesis/browser-extension
      - run: node hypothesis/test-library-routing.mjs
